<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>吃什么 · 转盘</title>
<meta name="description" content="一个转盘，决定今天吃什么。选项可随时增删改，改动保存在云端。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23b4401f'/><path d='M16 16 L16 3 A13 13 0 0 1 27.3 22.5 Z' fill='%23f6f2e9'/></svg>">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-trash" viewBox="0 0 16 16"><path d="M3 4.5h10M6.2 4.5V2.9h3.6v1.6M4.8 4.5l.55 8.6h5.3l.55-8.6"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="M10.1 10.1 13.5 13.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.4 6.4 11.8 13 5.2"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 3v9M4.4 8.6 8 12.2l3.6-3.6"/></symbol>
  <symbol id="i-dice" viewBox="0 0 16 16"><rect x="2.6" y="2.6" width="10.8" height="10.8" rx="2.2"/><circle cx="6" cy="6" r=".9" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r=".9" fill="currentColor" stroke="none"/><circle cx="10" cy="6" r=".9" fill="currentColor" stroke="none"/><circle cx="6" cy="10" r=".9" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-lock" viewBox="0 0 16 16"><rect x="3.2" y="7" width="9.6" height="6.6" rx="1.6"/><path d="M5.6 7V5.2a2.4 2.4 0 0 1 4.8 0V7"/></symbol>
  <symbol id="i-key" viewBox="0 0 16 16"><circle cx="6" cy="10" r="3.2"/><path d="M8.4 7.6 13 3M11.2 4.8l1.4 1.4M12.6 3.4l1.4 1.4"/></symbol>
  <symbol id="i-edit" viewBox="0 0 16 16"><path d="M9.8 3.2 12.8 6.2M3 13l.7-2.9 7.1-7.1a1.4 1.4 0 0 1 2 0l.9.9a1.4 1.4 0 0 1 0 2l-7.1 7.1L3 13z"/></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true"></span>
    <span class="brand__name">吃什么</span>
  </div>
  <div class="topbar__meta">
    <span class="pill" id="syncState" data-state="idle">载入中</span>
    <button class="ghost" id="passBtn" type="button" hidden>
      <svg class="i" aria-hidden="true"><use href="#i-key"></use></svg>
      <span>口令</span>
    </button>
    <button class="ghost" id="editToggle" type="button">
      <svg class="i" aria-hidden="true"><use href="#i-lock"></use></svg>
      <span id="editToggleText">编辑</span>
    </button>
  </div>
</header>

<main class="stage">

  <!-- ————— 转盘 ————— -->
  <section class="wheelzone" aria-labelledby="wheelHeading">
    <h1 class="sr-only" id="wheelHeading">吃什么转盘</h1>

    <div class="wheelwrap">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" role="img" aria-label="选项转盘，点击下方按钮开始抽取"></canvas>
      <div class="hub" aria-hidden="true">
        <span class="hub__count" id="hubCount">0</span>
        <span class="hub__unit">项</span>
      </div>
    </div>

    <div class="controls">
      <button class="spin" id="spinBtn" type="button" disabled>
        <svg class="i" aria-hidden="true"><use href="#i-dice"></use></svg>
        <span id="spinLabel">转一下</span>
      </button>
      <p class="result" id="result" aria-live="polite" aria-atomic="true">
        <span class="result__empty">点上面的按钮，让它替你做决定</span>
      </p>
    </div>
  </section>

  <!-- ————— 选项面板 ————— -->
  <aside class="panel" aria-labelledby="panelHeading">
    <div class="panel__head">
      <h2 id="panelHeading">选项</h2>
      <span class="count" id="countLabel">0</span>
    </div>

    <div class="panel__tools">
      <label class="search">
        <svg class="i" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="search" type="search" placeholder="搜索选项" autocomplete="off" spellcheck="false">
      </label>
      <button class="icon-btn" id="exportBtn" type="button" title="导出为文本" aria-label="导出为文本">
        <svg class="i" aria-hidden="true"><use href="#i-down"></use></svg>
      </button>
    </div>

    <!-- 分类筛选：只在转盘这一侧生效 -->
    <div class="filters" id="filters" hidden>
      <span class="filters__label">筛选</span>
      <div class="filters__chips" id="filterChips"></div>
      <button class="filters__clear" id="filterClear" type="button" hidden>全部</button>
    </div>

    <!-- 编辑态才出现的批量录入 -->
    <div class="composer" id="composer" hidden>
      <textarea id="pasteArea" rows="3" spellcheck="false"
        placeholder="粘贴一整列，一行一个。逗号、顿号、分号、制表符也能自动切开。"></textarea>
      <div class="composer__foot">
        <span class="hint" id="parseHint">支持批量粘贴</span>
        <div class="composer__acts">
          <button class="ghost ghost--sm" id="appendBtn" type="button">追加</button>
          <button class="ghost ghost--sm ghost--danger" id="replaceBtn" type="button">替换全部</button>
        </div>
      </div>
      <div class="quickadd">
        <input id="quickAdd" type="text" placeholder="输入一个，回车加入" autocomplete="off" maxlength="200">
        <button class="icon-btn icon-btn--solid" id="quickAddBtn" type="button" aria-label="添加这一项">
          <svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg>
        </button>
      </div>
    </div>

    <div class="panel__body">
    <ul class="list" id="list" aria-label="选项列表"></ul>
    <div class="empty" id="emptyState" hidden>
      <p class="empty__title">还没有选项</p>
      <p class="empty__body">点右上角「编辑」，把候选都粘进来。</p>
    </div>

    <div class="batchbar" id="batchbar" hidden>
      <span class="batchbar__count" id="batchCount">已选 0 项</span>
      <div class="batchbar__acts">
        <button class="ghost ghost--sm" id="batchTag" type="button">分类</button>
        <button class="ghost ghost--sm" id="batchEnable" type="button">启用</button>
        <button class="ghost ghost--sm" id="batchDisable" type="button">停用</button>
        <button class="ghost ghost--sm ghost--danger" id="batchDelete" type="button">删除</button>
      </div>
    </div>

    <!-- 给选中项打标签 -->
    <div class="tagpop" id="tagPop" hidden>
      <div class="tagpop__head">
        <span id="tagPopTitle">给 0 项设置分类</span>
        <button class="icon-btn" id="tagPopClose" type="button" aria-label="关闭">
          <svg class="i" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="tagpop__list" id="tagPopList"></div>
      <div class="tagpop__new">
        <input id="tagNewInput" type="text" placeholder="新分类名，回车创建" maxlength="20" autocomplete="off">
        <button class="icon-btn icon-btn--solid" id="tagNewBtn" type="button" aria-label="创建分类">
          <svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg>
        </button>
      </div>
    </div>
    </div>
  </aside>
</main>

<!-- 口令登录 -->
<dialog class="dlg" id="loginDlg" aria-labelledby="loginTitle">
  <form method="dialog" class="dlg__form" id="loginForm">
    <h2 id="loginTitle">解锁编辑</h2>
    <p class="dlg__sub">输入编辑口令。口令只在服务端校验，本地不留存。</p>
    <input type="password" id="tokenInput" name="token" placeholder="编辑口令" autocomplete="current-password" required>
    <p class="dlg__err" id="loginErr" hidden></p>
    <div class="dlg__acts">
      <button class="ghost" type="button" id="loginCancel">取消</button>
      <button class="primary" type="submit" id="loginSubmit">解锁</button>
    </div>
  </form>
</dialog>

<!-- 管理分类 -->
<dialog class="dlg dlg--sm" id="tagDlg" aria-labelledby="tagDlgTitle">
  <form method="dialog" class="dlg__form" id="tagForm">
    <h2 id="tagDlgTitle">管理分类</h2>
    <p class="dlg__sub" id="tagDlgSub">改名，或删掉这个分类。</p>

    <label class="field">
      <span class="field__label">分类名</span>
      <input type="text" id="tagDlgName" maxlength="20" required autocomplete="off">
    </label>

    <p class="dlg__err" id="tagDlgErr" hidden></p>
    <div class="dlg__acts dlg__acts--split">
      <button class="ghost ghost--danger" type="button" id="tagDlgDelete">删除分类</button>
      <div class="dlg__acts">
        <button class="ghost" type="button" id="tagDlgCancel">取消</button>
        <button class="primary" type="submit" id="tagDlgSave">保存</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- 修改口令 -->
<dialog class="dlg" id="passDlg" aria-labelledby="passTitle">
  <form method="dialog" class="dlg__form" id="passForm">
    <h2 id="passTitle">修改编辑口令</h2>
    <p class="dlg__sub">改完立刻生效，不用重新部署。</p>

    <label class="field" id="currentField" hidden>
      <span class="field__label">当前口令</span>
      <input type="password" id="passCurrent" autocomplete="current-password">
    </label>

    <label class="field">
      <span class="field__label">新口令</span>
      <input type="password" id="passNext" autocomplete="new-password" minlength="6" required>
    </label>

    <label class="field">
      <span class="field__label">再输一次</span>
      <input type="password" id="passRepeat" autocomplete="new-password" minlength="6" required>
    </label>

    <p class="dlg__err" id="passErr" hidden></p>
    <div class="dlg__acts">
      <button class="ghost" type="button" id="passCancel">取消</button>
      <button class="primary" type="submit" id="passSubmit">保存口令</button>
    </div>
  </form>
</dialog>

<script src="./app.js" type="module"></script>
</body>
</html>
